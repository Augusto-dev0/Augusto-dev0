<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0000"/>
      <stop offset="0.5" stop-color="#e50914"/>
      <stop offset="1" stop-color="#7a0000"/>
    </linearGradient>
    <linearGradient id="shadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="shadeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#red)"/>
    <rect width="1200" height="260" fill="url(#shadeH)"/>
    <rect width="1200" height="260" fill="url(#shadeV)"/>
    <polygon points="760,0 900,0 640,260 500,260" fill="#fff" opacity="0.04"/>
    <polygon points="960,0 1020,0 760,260 700,260" fill="#fff" opacity="0.03"/>
  </g>

  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" letter-spacing="6" fill="#ffffff" filter="url(#shadow)">LUIZ AUGUSTO</text>
</svg>
